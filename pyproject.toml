[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vessell-framework"
version = "3.12.0"
description = "VessellFramework: six-pillar evidence specialist with human-led Knowing Field inquiry, bounded Game Theory, and provenance."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.13", "ruff>=0.8", "types-jsonschema>=4.23", "python-dotenv>=1.0", "fastapi>=0.115", "httpx>=0.27", "azure-identity>=1.17", "azure-monitor-query>=1.3"]
core = ["pydantic>=2.9", "jsonschema>=4.23", "rich>=13.9", "typer>=0.15"]
agent = ["httpx>=0.27", "openai>=1.55"]
documents = ["pypdf>=5", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]
evaluation = ["pypdf>=5", "duckdb>=1.4"]
research = ["beautifulsoup4>=4.12", "networkx>=3.4", "pyyaml>=6.0"]
soc = ["azure-identity>=1.17", "azure-monitor-query>=1.3"]
orchestrator = ["fastapi>=0.115", "httpx>=0.28", "uvicorn[standard]>=0.34"]
ambient = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn>=0.34"]

[project.scripts]
vessell = "vessell.cli:main"
vessell-tools = "vessell.tooling.cli:main"
vessell-study = "vessell.case_study:main"
vessell-workflow = "vessell.workflow:main"
vessell-game = "vessell.game_bridge:main"
vessell-game-theory = "vessell.game_theory:main"
vessell-ambient = "vessell.ambient.cli:main"
vessell-capture = "vessell.ambient.capture:main"
vessell-program = "vessell.app.main:main"
vessell-remediator = "vessell.app.remediation_orchestrator:main"
vf = "vessell.cli:main"
vf-program = "vessell.app.main:main"
vf-remediator = "vessell.app.remediation_orchestrator:main"
vf-heatmap = "vessell.heatmap:main"
vessell-heatmap = "vessell.heatmap:main"
vf-attack-surface = "vessell.attack_surface:main"
vessell-attack-surface = "vessell.attack_surface:main"
vf-hockey-heatmap = "vessell.hockey_heatmap:main"
vessell-hockey-heatmap = "vessell.hockey_heatmap:main"
vf-posture-agent = "vessell.posture_agent:main"
vf-search-gate = "vessell.search_gate:main"
vessell-memory = "vessell.memory_store:main"
vessell-research-catalog = "vessell.research_catalog:main"

[tool.setuptools.packages.find]
include = ["vessell*", "vessel*"]

[tool.setuptools.package-data]
vessell = ["schemas/*.json", "py.typed"]
"vessell.app" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["vessell", "vessel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
