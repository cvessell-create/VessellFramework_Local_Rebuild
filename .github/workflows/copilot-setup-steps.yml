name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-instructions.md
      - .github/workflows/ci.yml
      - docs/memory-store.md
      - pyproject.toml
      - vessell/memory_store.py
      - tests/test_memory_store.py
      - r/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-instructions.md
      - .github/workflows/ci.yml
      - docs/memory-store.md
      - pyproject.toml
      - vessell/memory_store.py
      - tests/test_memory_store.py
      - r/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install system dependency for R filesystem and rendering packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
      - name: Install Python project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,core,agent,documents,evaluation,research,soc,orchestrator]"
      - name: Install R memory and statistics dependencies
        run: Rscript r/setup.R
      - name: Verify Python and R toolchains
        run: |
          python --version
          Rscript --version
          python -m vessell.memory_store --help
          Rscript r/memory_store.R --help
      - name: Run Python and R checks
        run: |
          python -m pytest -q
          Rscript r/test_memory_store.R
          Rscript r/test_statistics_environment.R
          python verify_manifest.py
