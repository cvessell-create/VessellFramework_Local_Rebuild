name: Public-safe agent analysis
run-name: "Agent preview | ${{ github.run_id }}"
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Public-non-sensitive v1 request JSON (32768 bytes maximum; never private cases)
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce owner and default-branch boundary
        run: |
          test "$GITHUB_REPOSITORY" = "cvessell-create/VessellFramework_Local_Rebuild" || { echo "Repository rejected"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/master" || { echo "Ref rejected"; exit 1; }
          test "$GITHUB_ACTOR" = "cvessell-create" || { echo "Actor rejected"; exit 1; }
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "Event rejected"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[core,ambient,verifier]"
      - name: Build unreleased analysis preview
        env:
          VF_REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          mkdir -p results
          python -m vessell.hosted_agent --github --output results/preview.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/preview.json
          if-no-files-found: error
          retention-days: 7
