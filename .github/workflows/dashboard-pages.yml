name: Dashboard Checks

on:
  push:
    branches: [master]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test dashboard logic
        run: node --test dashboard/tests/*.test.js
