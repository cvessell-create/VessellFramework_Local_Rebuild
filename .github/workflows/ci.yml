name: VessellFramework CI

on:
  push:
  pull_request:

jobs:
  github-observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
      - run: Rscript r/test_github_observatory.R
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,core,orchestrator,evaluation]"
      - run: python -m pytest -q
      - run: node --test dashboard/tests/*.test.js
      - run: python verify_manifest.py
      - run: python -m vessell.case_study --spec case_studies/claim_correction/spec.json --output-dir /tmp/vessell-case-study
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/vessell-wheel
      - run: python -m pip install --force-reinstall --no-deps /tmp/vessell-wheel/*.whl
      - run: cd /tmp && vessell-study --spec "$GITHUB_WORKSPACE/case_studies/claim_correction/spec.json" --output-dir /tmp/vessell-installed-case-study
      - run: cd /tmp && vessell-workflow --spec "$GITHUB_WORKSPACE/case_studies/game_patterns/workflow.json" --output-dir /tmp/vessell-workflow-a
      - run: cd /tmp && vessell-workflow --spec "$GITHUB_WORKSPACE/case_studies/game_patterns/workflow.json" --output-dir /tmp/vessell-workflow-b --compare-to /tmp/vessell-workflow-a
      - run: cd /tmp && vessell-workflow --output-dir /tmp/vessell-workflow-b --verify-only
      - run: cd /tmp && vessell-ambient --database /tmp/installed-ambient.sqlite init
      - run: cd /tmp && vessell-ambient --database /tmp/installed-ambient.sqlite verify
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test && npm run build && npm run typecheck
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  static-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,core,ambient]"
      - run: docker build -t vessell-static-capture:local deploy/capture
      - run: python -m pytest -q tests/test_static_capture_container.py
        env:
          VESSELL_CAPTURE_CONTAINER_TEST: "1"